<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- PioVation brand favicon. The white mark is used everywhere
       because the green-on-light variant gets washed out on the
       browser-chrome tab strip on most setups. The white logo reads
       well on both light + dark browser chromes. -->
  <link rel="icon" type="image/png" href="/images/pv_white.png" />
  <link rel="shortcut icon" href="/images/pv_white.png" />
  <link rel="apple-touch-icon" href="/images/pv_white.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>PioSphere</title>
  <meta name="title" content="PioSphere - PioVation Cloud" />
  <meta name="description" content="PioSphere - the PioVation Cloud operating system for AI workloads." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://app.piosphere.ai" />
  <meta property="og:title" content="PioSphere" />
  <meta property="og:description" content="PioSphere - the PioVation Cloud operating system for AI workloads." />
  <meta property="og:image" content="/images/pv_white_long_tight.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://app.piosphere.ai" />
  <meta property="twitter:title" content="PioSphere" />
  <meta property="twitter:description" content="PioSphere - the PioVation Cloud operating system for AI workloads." />
  <meta property="twitter:image" content="/images/pv_white_long_tight.png" />

  <!-- Fonts are self-hosted and bundled by Vite (see src/styles/index.css).
       Do not add a fonts.googleapis.com link here: it breaks air-gapped
       deployments, and it fails silently by falling back to a system face. -->

  <meta name="theme-color" content="#fff" />

  <!-- Runtime config. Generated by docker/runtime-config.sh at
       container start from environment variables passed via compose.
       MUST load before the React bundle so window.__APP_CONFIG__ is
       populated when the app reads it. See
       src/lib/runtime-config.ts. -->
  <script src="/config.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
