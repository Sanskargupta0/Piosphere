name: Sync customer API docs

# When the API changes, regenerate the customer-facing OpenAPI spec and
# open a pull request in this repository updating docs/openapi.json. The
# docs update is reviewed by the team before it goes live; merging the PR
# triggers the deploy workflow that publishes the site.
#
# This is a single-repo flow: the service lives in service/, the frontend
# at the root, so the default GITHUB_TOKEN is enough — no PAT required.

on:
  push:
    branches: [main]
    paths:
      - "service/app/**"
      - "service/scripts/export_openapi.py"
      - ".github/workflows/sync-docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-docs
  cancel-in-progress: true

jobs:
  sync-docs:
    name: Filter customer APIs and open docs PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "fastapi>=0.115" "pydantic[email]"

      - name: Generate customer-facing OpenAPI spec
        working-directory: service
        run: python scripts/export_openapi.py --output customer-openapi.json

      - name: Check whether the spec actually changed
        id: diff
        run: |
          if cmp --silent service/customer-openapi.json docs/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Customer OpenAPI spec unchanged — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The generated file must land at docs/openapi.json — that is what
      # the frontend imports and what the PR is meant to update.
      - name: Stage the new spec
        if: steps.diff.outputs.changed == 'true'
        run: cp service/customer-openapi.json docs/openapi.json

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/customer-openapi
          delete-branch: true
          title: "docs: update customer OpenAPI spec from pioagent-service"
          commit-message: |
            docs: update customer OpenAPI spec from pioagent-service

            Generated by the sync-docs workflow from service/ at
            commit ${{ github.sha }}.
          body: |
            This pull request updates the customer-facing OpenAPI specification
            (`docs/openapi.json`) rendered at `/docs`.

            It was created automatically by the **sync-docs** workflow after commit
            [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            changed the PioAgent service.

            **What to review:** the diff below shows exactly what changes in the
            customer documentation at `/docs` once this is merged and deployed.

            | | |
            |---|---|
            | Source | `${{ github.repository }}@${{ github.sha }}` |
            | Workflow | [sync-docs run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Merging this PR triggers the deploy workflow and the change goes live.
          labels: |
            documentation
            automated
